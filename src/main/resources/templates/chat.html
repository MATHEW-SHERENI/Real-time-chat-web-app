<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real-Time chat Application</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@5.0.0/bundles/stomp.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.1/stomp.min.js"></script>
    <style>
        .message-left {
            text-align: left;
            margin-bottom: 10px;
        }
        .message-right {
            text-align: right;
            margin-bottom: 10px;
        }
        .message-content {
            display: inline-block;
            max-width: 70%;
            padding: 10px;
            border-radius: 15px;
            word-wrap: break-word;
        }
        .message-left .message-content {
            background-color: #e9ecef;
            border-top-left-radius: 0;
        }
        .message-right .message-content {
            background-color: #007bff;
            color: white;
            border-top-right-radius: 0;
        }
        .message-time {
            font-size: 0.8em;
            opacity: 0.7;
            margin-top: 5px;
            display: block;
        }
        .file-attachment {
            margin-top: 8px;
            padding: 8px;
            background-color: #f8f9fa;
            border-radius: 8px;
            font-size: 0.9em;
        }
        .file-attachment a {
            word-break: break-all;
        }
        .image-attachment {
            max-width: 200px;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 5px;
        }
    </style>
</head>

<body>
<div class="container mt-4">
    <h1 class="text-center">Real-Time Chat Application</h1>
    <div id="chat" class="border rounded p-3 mb-3" style="height: 400px; overflow-y: auto;">
    </div>
    <div class="input-group mb-3">
        <input id="senderInput" type="text" class="form-control" placeholder="Your Name--zita rako....."/>
    </div>
    <div class="input-group mb-3">
        <input id="messageInput" type="text" class="form-control" placeholder="Type your message--Nyora nhau yako....."/>
        <input type="file" id="fileInput" class="form-control d-none" accept="image/*,.pdf,.doc,.docx,.txt">
        <label for="fileInput" class="btn btn-outline-secondary btn-sm" style="margin-left: 5px;">
            Attach File
        </label>
        <div class="input-group-append">
            <button id="sendMessage" class="btn btn-primary">Send</button>
        </div>
    </div>
    <div id="fileInfo" class="mt-2" style="display: none;">
        Selected file: <span id="fileNameDisplay"></span>
        <button id="clearFile" class="btn btn-sm btn-outline-danger">Clear</button>
    </div>
</div>

<script>
    // Define stompClient at global scope
    var stompClient = null;
    var currentUser = ""; // Will be set when user enters their name
    var selectedFile = null; // Store selected file data

    function setConnected(connected) {
        document.getElementById('sendMessage').disabled = !connected;
    }

    function connect() {
        var socket = new SockJS('chat');
        stompClient = Stomp.over(socket);
        stompClient.connect({}, function (frame) {
            setConnected(true);
            stompClient.subscribe('/topic/messages', function (message) {
                showMessage(JSON.parse(message.body));
            });
        });
    }

    function showMessage(message) {
        var chat = document.getElementById('chat');
        var messageContainer = document.createElement('div');
        
        // Determine if message is from current user or other user
        var isCurrentUser = message.sender === currentUser;
        messageContainer.className = isCurrentUser ? 'message-right' : 'message-left';
        
        var messageContent = document.createElement('div');
        messageContent.className = 'message-content';
        
        // Create message text
        var messageText = document.createElement('div');
        messageText.textContent = message.sender + ': ' + (message.content || '');
        messageContent.appendChild(messageText);
        
        // Add file attachment if present
        if (message.fileData && message.fileName) {
            var fileAttachment = document.createElement('div');
            fileAttachment.className = 'file-attachment';
            
            // Check if it's an image
            if (message.fileName.match(/\.(jpg|jpeg|png|gif|bmp|webp)$/i)) {
                var img = document.createElement('img');
                img.src = 'data:image/*;base64,' + message.fileData;
                img.className = 'image-attachment';
                img.alt = message.fileName;
                fileAttachment.appendChild(img);
            } else {
                // For other file types, show as link
                var fileLink = document.createElement('a');
                fileLink.href = 'data:application/octet-stream;base64,' + message.fileData;
                fileLink.download = message.fileName;
                fileLink.textContent = '📎 ' + message.fileName;
                fileAttachment.appendChild(fileLink);
            }
            messageContent.appendChild(fileAttachment);
        }
        
        // Add timestamp
        var timeElement = document.createElement('div');
        timeElement.className = 'message-time';
        
        // Format timestamp - handle ISO string format from Java LocalDateTime
        var timestamp;
        if (message.timestamp) {
            // Parse ISO 8601 format (e.g., "2024-01-15T10:30:45.123")
            timestamp = new Date(message.timestamp);
        } else {
            timestamp = new Date();
        }
        var timeString = formatTime(timestamp);
        timeElement.textContent = timeString;
        
        messageContent.appendChild(timeElement);
        messageContainer.appendChild(messageContent);
        chat.appendChild(messageContainer);
        chat.scrollTop = chat.scrollHeight;
    }
    
    function formatTime(date) {
        var hours = date.getHours();
        var minutes = date.getMinutes();
        var ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12; // the hour "0" should be "12"
        minutes = minutes < 10 ? '0' + minutes : minutes;
        var strTime = hours + ':' + minutes + ' ' + ampm;
        return strTime;
    }

    function sendMessage() {
        var sender = document.getElementById('senderInput').value;
        var content = document.getElementById('messageInput').value.trim();

        if (sender.trim() === '') {
            alert('Please enter your name');
            return;
        }

        // Set current user if not set
        if (currentUser === '') {
            currentUser = sender;
        }

        var chatMessage = {
            sender: sender,
            content: content
        };

        // Add file data if a file is selected
        if (selectedFile) {
            chatMessage.fileData = selectedFile.data;
            chatMessage.fileName = selectedFile.name;
        }

        stompClient.send("/app/sendMessages", {}, JSON.stringify(chatMessage));
        document.getElementById('messageInput').value = '';
        clearFileSelection();
    }

    function clearFileSelection() {
        selectedFile = null;
        document.getElementById('fileInput').value = '';
        document.getElementById('fileInfo').style.display = 'none';
        document.getElementById('fileNameDisplay').textContent = '';
    }

    // File input change handler
    document.getElementById('fileInput').addEventListener('change', function(e) {
        var file = e.target.files[0];
        if (file) {
            // Check file size (limit to 5MB)
            if (file.size > 5 * 1024 * 1024) {
                alert('File size exceeds 5MB limit');
                this.value = '';
                return;
            }
            
            var reader = new FileReader();
            reader.onload = function(e) {
                selectedFile = {
                    data: e.target.result.split(',')[1], // Get base64 part
                    name: file.name
                };
                document.getElementById('fileInfo').style.display = 'block';
                document.getElementById('fileNameDisplay').textContent = file.name;
            };
            reader.onerror = function(e) {
                alert('Error reading file');
            };
            reader.readAsDataURL(file);
        }
    });

    document.getElementById('sendMessage').onclick = sendMessage;
    // Add event listener for Enter key on message input
    document.getElementById('messageInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
    
    // Clear file button
    document.getElementById('clearFile').onclick = clearFileSelection;

    window.onload = connect;
</script>
</body>
</html>
